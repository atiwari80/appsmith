name: client-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/client/**'
  pull_request:
    paths:
      - 'app/client/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: app/client/yarn.lock

      - name: Install dependencies
        run: |
          cd app/client
          yarn install --immutable

      - name: Build client
        run: |
          cd app/client
          ./build.sh
