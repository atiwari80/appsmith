name: server-build

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/server/**'
  pull_request:
    paths:
      - 'app/server/**'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build server
        run: |
          cd app/server
          ./build.sh
